name: Vellem
options:
  knownRegions: [en, fr, Base]
  bundleIdPrefix: com.adriendonot
  fileTypes:
    icon:
      file: true
      buildPhase: resources
  deploymentTarget:
    macOS: "26.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: MKAFV9VL9V
    CODE_SIGN_STYLE: Automatic
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
targets:
  Vellem:
    type: application
    platform: macOS
    sources:
      - path: Vellem
        excludes: [ReaderResources]
      - path: Vellem/ReaderResources
        type: folder
        buildPhase: resources
      - path: VellemShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriendonot.Vellem
        INFOPLIST_FILE: Vellem/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: VellemFold
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Vellem/Vellem.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - MKAFV9VL9V.com.adriendonot.Vellem
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.adriendonot.Vellem-spks
          - com.adriendonot.Vellem-spki
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    dependencies:
      - target: VellemReplies
        embed: true
      - target: VellemWidget
      - target: VellemMCP
      - package: Sparkle
    postBuildScripts:
      - name: Verify embedded MCP App Group signature
        inputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/vellem-mcp"
          - "$(SRCROOT)/script/verify-mcp-signature.sh"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/vellem-mcp-signature-verified"
        script: |
          set -e
          /bin/sh "${SCRIPT_INPUT_FILE_1}" "${SCRIPT_INPUT_FILE_0}"
          /usr/bin/touch "${SCRIPT_OUTPUT_FILE_0}"
  VellemMCP:
    productName: vellem-mcp
    type: tool
    platform: macOS
    sources:
      - path: VellemMCP
      - path: Vellem/Models
      - path: VellemShared
        excludes: [AgentMarks.xcassets]
    settings:
      base:
        PRODUCT_NAME: vellem-mcp
        SKIP_INSTALL: YES
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    entitlements:
      path: VellemMCP/VellemMCP.entitlements
      properties:
        com.apple.security.application-groups:
          - MKAFV9VL9V.com.adriendonot.Vellem
  VellemReplies:
    type: xpc-service
    platform: macOS
    sources:
      - path: VellemReplies
      - path: Vellem/Models
      - path: VellemShared
        excludes: [AgentMarks.xcassets]
      - path: VellemMCP/NotesFileStore.swift
      - path: VellemMCP/MCPError.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriendonot.Vellem.Replies
        INFOPLIST_FILE: VellemReplies/Info.plist
        CODE_SIGN_ENTITLEMENTS: VellemMCP/VellemMCP.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  VellemWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: VellemWidget
      - path: Vellem/Localizable.xcstrings
      - path: VellemShared
        excludes: [AgentMarks.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriendonot.Vellem.Widget
        INFOPLIST_FILE: VellemWidget/Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: VellemWidget/VellemWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - MKAFV9VL9V.com.adriendonot.Vellem
  VellemMobile:
    type: application
    platform: iOS
    sources:
      - path: VellemMobile
      - path: Vellem/Localizable.xcstrings
      - path: Vellem/Views/LanguagePicker.swift
      - path: Vellem/Views/MessageCopyLabel.swift
      - path: Vellem/Views/MailboxUnreadDot.swift
      - path: Vellem/VellemFold.icon
      - path: Vellem/ReaderResources
        type: folder
        buildPhase: resources
      - path: Vellem/Models/Note.swift
      - path: Vellem/Models/Folder.swift
      - path: VellemShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.adriendonot.Vellem.Mobile
        INFOPLIST_FILE: VellemMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: VellemFold
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: VellemMobile/VellemMobile.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.adriendonot.Vellem
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.adriendonot.Vellem
        com.apple.developer.icloud-services:
          - CloudDocuments
