<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data: https: vellem-image:; connect-src 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<title>Message</title>
<link rel="stylesheet" href="reader.css">
<script defer src="vendor/markdown-it.js"></script>
<script defer src="vendor/footnote.js"></script>
<script defer src="vendor/texmath.js"></script>
<script defer src="vendor/katex.js"></script>
<script defer src="vendor/purify.js"></script>
<script defer src="vendor/highlight.js"></script>
<script defer src="reader.js"></script>
</head>
<body>
<main>
<header id="envelope" hidden>
<h1 id="subject"></h1>
<div class="byline">
<img id="sender-mark" alt="" width="34" height="34">
<div class="sender"><strong id="author"></strong><span id="folder"></span></div>
<time id="sent"></time>
</div>
</header>
<article id="message"></article>
<section id="replies" aria-live="polite"></section>
</main>
</body>
</html>
