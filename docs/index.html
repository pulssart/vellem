<style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<body>
<div id="root"></div>
<a href="directions-canvas.html" class="vlm-explore-link">← see all 3 directions</a>

<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="direction-a.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroWord": "forget",
  "showLiveDemo": false,
  "showProblem": true,
  "showTools": true,
  "showNative": true,
  "showSetup": true,
  "showWhatsNew": true
}/*EDITMODE-END*/;

function VellemLanding() {
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  const DirA = window.DirectionA;
  const {
    TweaksPanel, TweakSection, TweakRadio, TweakToggle,
  } = window;
  return (
    <div>
      <DirA width="100%" tweaks={tweaks} />
      <TweaksPanel title="Vellem · tweaks">
        <TweakSection label="Hero" />
        <TweakRadio
          label="Verb"
          value={tweaks.heroWord}
          options={["forget", "vanish", "fade"]}
          onChange={(v) => setTweak("heroWord", v)}
        />
        <TweakSection label="Sections" />
        <TweakToggle label="Live demo"   value={tweaks.showLiveDemo} onChange={(v) => setTweak("showLiveDemo", v)} />
        <TweakToggle label="The problem" value={tweaks.showProblem}  onChange={(v) => setTweak("showProblem", v)} />
        <TweakToggle label="14 tools"    value={tweaks.showTools}    onChange={(v) => setTweak("showTools", v)} />
        <TweakToggle label="Native bits" value={tweaks.showNative}   onChange={(v) => setTweak("showNative", v)} />
        <TweakToggle label="Setup"       value={tweaks.showSetup}    onChange={(v) => setTweak("showSetup", v)} />
        <TweakToggle label="What's new"  value={tweaks.showWhatsNew} onChange={(v) => setTweak("showWhatsNew", v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<VellemLanding />);
</script>
</body>
</html>
