<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Vellem — landing directions</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0c0c0c; color: #fff; font-family: 'Inter Tight', system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="direction-a.jsx"></script>
<script type="text/babel" src="direction-b.jsx"></script>
<script type="text/babel" src="direction-c.jsx"></script>

<script type="text/babel" data-presets="react">
function VellemDirectionsApp() {
  const DC  = window.DesignCanvas;
  const Sec = window.DCSection;
  const Art = window.DCArtboard;
  return (
    <DC title="Vellem — landing directions" subtitle="Three takes on a more interesting Vellem.com">
      <Sec id="forgetting" title="Direction A — The Forgetting">
        <Art id="a" label="Editorial manifesto · cream paper · words that erase themselves" width={1280} height={3400}>
          <window.DirectionA />
        </Art>
      </Sec>
      <Sec id="livedesk" title="Direction B — Live Desk">
        <Art id="b" label="Apple-grade macOS diorama · Claude writes a note in real time" width={1280} height={3400}>
          <window.DirectionB />
        </Art>
      </Sec>
      <Sec id="atelier" title="Direction C — Agent Atelier">
        <Art id="c" label="Playful · agents personified as orbs scribbling into folders" width={1280} height={3400}>
          <window.DirectionC />
        </Art>
      </Sec>
    </DC>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<VellemDirectionsApp />);
</script>
</body>
</html>
